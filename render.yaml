services:
  - type: web
    name: game-store-api
    env: php
    buildCommand: "./render-build.sh"
    startCommand: "php artisan serve --host=0.0.0.0 --port=10000"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://game-store-api.onrender.com
      - key: FRONTEND_URL
        value: https://gamestoredz.vercel.app
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: game-store-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: game-store-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: game-store-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: game-store-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: game-store-db
          property: password
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: laravel-storage
      mountPath: /var/www/html/storage
      sizeGB: 1